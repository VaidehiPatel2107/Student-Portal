<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub - Directory (Fetch & Filter)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <header class="p-3 border-bottom d-flex justify-content-between align-items-center bg-white">
    <h1 class="h4 mb-0">StudentHub - Student Directory</h1>
    <a href="index.html" class="btn btn-outline-secondary btn-sm">Home</a>
  </header>

  <main class="container my-4">
    <!-- Controls Section: Search, Filter, Sort, Error trigger -->
    <div class="card p-3 mb-4 shadow-sm">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <input type="text" id="search-input" class="form-control" placeholder="Search by name or ID...">
        </div>
        <div class="col-md-3">
          <select id="department-filter" class="form-select">
            <option value="ALL">All Departments</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="BCA">BCA</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="sort-select" class="form-select">
            <option value="name-asc">Sort Name (A-Z)</option>
            <option value="name-desc">Sort Name (Z-A)</option>
            <option value="gpa-desc">Highest GPA</option>
            <option value="gpa-asc">Lowest GPA</option>
          </select>
        </div>
        <div class="col-md-2 d-flex gap-1">
          <button id="reload-btn" class="btn btn-outline-primary w-100">Reset</button>
          <button id="error-btn" class="btn btn-outline-danger" title="Simulate 404 Error">Test Error</button>
        </div>
      </div>
    </div>

    <!-- Loading and Error Indicators -->
    <div id="loading-spinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Fetching student records from JSON API...</p>
    </div>

    <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

    <!-- Data Display Table -->
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Roll ID</th>
              <th>Student Name</th>
              <th>Department</th>
              <th>Semester</th>
              <th>Cumulative GPA</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
            <!-- Dynamically Rendered Rows -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pagination Controls -->
    <nav class="d-flex justify-content-between align-items-center mt-3">
      <span id="page-indicator" class="text-muted small"></span>
      <ul id="pagination-list" class="pagination pagination-sm mb-0"></ul>
    </nav>
  </main>

  <script src="js/data-portal.js"></script>
</body>
</html>
