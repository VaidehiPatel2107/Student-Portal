<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudentHub - Student Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .navbar-brand {
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .card {
      border: 1px solid #dee2e6;
      border-radius: 8px;
    }
    .btn-action {
      min-width: 90px;
    }
  </style>
</head>
<body>

<!-- Header Navigation -->
<header class="p-3 bg-white border-bottom shadow-sm mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <h3 class="h4 mb-0 text-primary fw-bold">StudentHub</h3>
    <span class="text-muted small">Student Records System</span>
  </div>
</header>

<main class="container my-4" style="max-width: 960px;">

  <!-- Alert Container -->
  <div id="alertBox" class="alert d-none" role="alert"></div>

  <!-- Form Card -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white py-2">
      <span id="formTitle" class="fw-semibold">Add New Student</span>
    </div>
    <div class="card-body p-4">
      <form id="studentForm" class="row g-3 align-items-end">
        <input type="hidden" id="studentId" value="">

        <div class="col-md-4">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter student name">
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@charusat.edu.in">
        </div>

        <div class="col-md-2">
          <label class="form-label fw-semibold">Course</label>
          <select id="course" class="form-select">
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="CE">CE</option>
          </select>
        </div>

        <div class="col-md-2">
          <button type="submit" id="submitBtn" class="btn btn-primary w-100 btn-action">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Records Table Card -->
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2">
      <span class="fw-semibold">Registered Students</span>
      <button id="refreshBtn" class="btn btn-outline-light btn-sm">Refresh</button>
    </div>
    <div class="card-body p-0">
      
      <!-- Loading Spinner -->
      <div id="loadingIndicator" class="text-center py-4 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-muted mt-2 mb-0 small">Loading records...</p>
      </div>

      <table class="table table-bordered table-hover align-middle mb-0" id="recordsTable">
        <thead class="table-light">
          <tr>
            <th style="width: 80px;">ID</th>
            <th>Name</th>
            <th>Email</th>
            <th style="width: 120px;">Course</th>
            <th style="width: 160px;" class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <!-- Injected via Fetch API -->
        </tbody>
      </table>
    </div>
  </div>

</main>

<script src="script.js"></script>
</body>
</html>
