<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
  <meta charset="UTF-8">
  <title>StudentHub - Contact Us</title>
</head>
<body>

  <header>
    <h1>StudentHub</h1><button id="theme-toggle-btn" class="btn btn-outline-secondary btn-sm">🌙 Dark Mode</button>
  </header>

  <nav>
    <a href="index.html">Home</a> |
    <a href="about-us.html">About Us</a> |
    <a href="contact-us.html">Contact Us</a> |
    <a href="login.html">Login</a>
  </nav>

  <main>
    <section>
      <h2>Contact Us</h2>
      <p>Have a question? Fill out the form below and we will get back to you.</p>

      <form>
        <p>
          <label for="name">Full Name</label><br>
          <input type="text" id="name" name="name">
        </p>

        <p>
          <label for="email">Email Address</label><br>
          <input type="email" id="email" name="email">
        </p>

        <p>
          <label for="message">Message</label><br>
          <textarea id="message" name="message" rows="5"></textarea>
        </p>

        <button type="submit">Send Message</button>
      </form>
    </section>

    <aside>
      <h3>College Address</h3>
      <p>StudentHub College, Vadodara, Gujarat</p>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 StudentHub. All rights reserved.</p>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
